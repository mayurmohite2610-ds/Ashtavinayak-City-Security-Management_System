<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ashtavinayak City - Security Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #111111, #252525);
        }

        .login-container {
            width: 420px;
            max-width: 92%;
            background: white;
            border-radius: 18px;
            padding: 40px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.45);
        }

        .society-name {
            text-align: center;
            font-size: 30px;
            font-weight: bold;
            color: #f57c00;
            margin-bottom: 8px;
        }

        .system-name {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            color: #222;
            margin-bottom: 30px;
        }

        .login-title {
            text-align: center;
            font-size: 24px;
            color: #333;
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #333;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 18px;
            outline: none;
        }

        input:focus {
            border-color: #f57c00;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #f57c00;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #e66f00;
        }

        .error {
            background: #ffe5e5;
            color: #c62828;
            border: 1px solid #ef9a9a;
            padding: 11px;
            border-radius: 8px;
            margin-bottom: 18px;
            text-align: center;
            font-size: 14px;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            color: #777;
            font-size: 13px;
        }

        .security-badge {
            text-align: center;
            margin-bottom: 20px;
            color: #555;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <!-- SOCIETY NAME -->
        <div class="society-name">
            Ashtavinayak City
        </div>


        <div class="security-badge">
            Security Login
        </div>


        <!-- ERROR MESSAGE -->
        {% if error %}
        <div class="error">
            {{ error }}
        </div>
        {% endif %}

        <!-- LOGIN FORM -->
        <form method="POST" action="{{ url_for('login') }}">

            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter username"
                autocomplete="username"
                required
            >

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter password"
                autocomplete="current-password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <div class="footer">
            Ashtavinayak City Security Management System
        </div>

    </div>

</body>
</html>
